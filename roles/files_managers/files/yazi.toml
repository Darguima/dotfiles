[opener]
extract = [
    { run = 'extract-here %s', desc = "Extract here", for = "unix" }
]

system = [
    { run = 'xdg-open %s1', desc = "System Default", orphan = true }
]

[open]
rules = [
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "system" ] },
    { mime = "folder/*", use = "system" },
    { url = "*", use = "system" }
]
