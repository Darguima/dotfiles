- name: Installing opencode
  pacman:
    name: opencode
    state: latest
  become: true

- name: Ensuring OpenCode config folder exists
  file:
    path: "{{ linux_user_home }}/.config/opencode"
    state: directory

# Check defaults/main.yml for the model variables used in the template.
- name: Copying OpenCode config from template
  template:
    src: opencode.jsonc
    dest: "{{ linux_user_home }}/.config/opencode/opencode.jsonc"

- name: Copying OpenCode global instructions
  copy:
    src: AGENTS.md
    dest: "{{ linux_user_home }}/.config/opencode/AGENTS.md"

- name: Ensuring OpenCode agents folder exists
  file:
    path: "{{ linux_user_home }}/.config/opencode/agents"
    state: directory

# Agents are markdown templates because their frontmatter references model variables.
- name: Deploying OpenCode agents from templates
  template:
    src: "agents/{{ item }}"
    dest: "{{ linux_user_home }}/.config/opencode/agents/{{ item }}"
  loop:
    - plan_pro.md
    - plan.md
    - build_pro.md
    - build.md
    - chat.md

- name: Ensuring OpenCode skills folder exists
  file:
    path: "{{ linux_user_home }}/.config/opencode/skills"
    state: directory

- name: Copying OpenCode skills
  copy:
    src: skills/
    dest: "{{ linux_user_home }}/.config/opencode/skills/"

- name: Copying OpenCode CLI config file (keybindings)
  copy:
    src: cli.json
    dest: "{{ linux_user_home }}/.config/opencode/cli.json"
    force: true
